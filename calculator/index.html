<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <title>kalkulator</title>
    </head>
    <body>
        <main>
            <div class="calculator">
                <div class="numbers-wrapper">
                    <input class="calc-input" type="text" placeholder="0" />
                    <div class="numbers">
                        <button id="btn1">7</button>
                        <button id="btn2">8</button>
                        <button id="btn3">9</button>
                        <button id="btn4">+</button>
                        <button id="btn5">4</button>
                        <button id="btn6">5</button>
                        <button id="btn7">6</button>
                        <button id="btn8">-</button>
                        <button id="btn9">1</button>
                        <button id="btn10">2</button>
                        <button id="btn11">3</button>
                        <button id="btn12">x</button>
                        <button id="btn13">c</button>
                        <button id="btn14">0</button>
                        <button id="btn15">=</button>
                        <button id="btn16">/</button>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
